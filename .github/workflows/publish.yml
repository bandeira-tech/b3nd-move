name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      npm_only:
        description: "Skip JSR; publish only the npm slice (catch npm up to an already-published JSR version)"
        type: boolean
        default: false

jobs:
  # Publishing is irreversible — a bad version needs a follow-up release, not a
  # retraction — and a dispatch publishes whatever is on the ref regardless of
  # whether CI ever passed on it. Gate on the fast lane first. The browser
  # integration matrix is left to CI; `deno task test` already covers every
  # transport in-Deno via the conformance runs.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno task check
      - run: deno task test
      - run: deno lint
      - run: deno fmt --check

  jsr:
    name: Publish to JSR
    needs: verify
    if: ${{ github.event.inputs.npm_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno publish

  npm:
    name: Publish universal slice to NPM
    needs: [verify, jsr]
    # `always()` is needed so npm still runs when jsr is deliberately skipped
    # (npm_only), but that also makes a *failed* verify look like a skipped
    # jsr — hence the explicit verify success check.
    if: ${{ always() && needs.verify.result == 'success' && (needs.jsr.result == 'success' || needs.jsr.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: deno task build:npm
      - working-directory: npm
        run: npm publish --access public
