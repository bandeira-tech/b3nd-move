# Buf codegen for b3nd.proto.
# Run: npx buf generate libs/b3nd-proto
# Output: libs/b3nd-proto/gen/
#
# bufbuild/es generates message types, schema descriptors, and the
# B3ndService GenService — everything needed without a separate
# connectrpc/es plugin (whose output is the legacy v1 API).
version: v2
plugins:
  - remote: buf.build/bufbuild/es
    out: gen
    opt:
      - target=ts
