syntax = "proto3";

package b3nd.v1;

// B3ndService — the four ProtocolInterfaceNode primitives over gRPC.
//
// Output is the universal addressed-content primitive: [uri, payload].
// `payload` is opaque to the framework — encoded as JSON-UTF-8 bytes by
// default, or raw bytes when `payload_is_binary` is true.

service B3ndService {
  // Receive a batch of messages — the unified entry point for all state changes.
  rpc Receive(ReceiveRequest) returns (ReceiveResponse);

  // Read a batch of urls (uri + optional query). Returns one Output per input,
  // in input order. Payload semantics are protocol-defined.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Observe a batch of urls — server-streaming INV-style change bundles.
  // Each streamed Output is [inputUrl, payload=string[] of uris that changed].
  rpc Observe(ObserveRequest) returns (stream OutputProto);

  // Health + capabilities.
  rpc Status(StatusRequest) returns (StatusResponse);
}

// ── Output ──────────────────────────────────────────────────────────

// The universal addressed-content primitive — [uri, payload].
message OutputProto {
  string uri = 1;
  // Payload as JSON-encoded bytes. Binary payloads are raw bytes.
  bytes payload = 2;
  // True if `payload` is raw binary (not JSON-encoded).
  bool payload_is_binary = 3;
}

// ── Receive ─────────────────────────────────────────────────────────

message ReceiveRequest {
  repeated OutputProto messages = 1;
}

message ReceiveResponse {
  repeated ReceiveResultProto results = 1;
}

message ReceiveResultProto {
  bool accepted = 1;
  string error = 2;
}

// ── Read ────────────────────────────────────────────────────────────

message ReadRequest {
  // One or more urls to read (uri + optional `?fn=...&...` query).
  repeated string urls = 1;
}

message ReadResponse {
  repeated OutputProto results = 1;
}

// ── Observe ─────────────────────────────────────────────────────────

message ObserveRequest {
  // URLs to observe — each may be a uri pattern (e.g. "mutable://app/users/*").
  repeated string urls = 1;
}

// ── Status ──────────────────────────────────────────────────────────

message StatusRequest {}

message StatusResponse {
  string status = 1;  // "healthy", "degraded", "unhealthy"
  string message = 2;
  // Schema as JSON array string.
  string schema_json = 3;
  // Extra details as JSON string.
  string details_json = 4;
  // Read fns advertised by this node as JSON array string.
  string fns_json = 5;
}
